# Build settings
markdown: kramdown
theme: minimal-mistakes-jekyll

minimal_mistakes_skin    : "dirt" # "default", "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale                   : "en"
title                    : "Domain-Driven Transformation"
title_separator          : "-"
subtitle                 : "Modernize Legacy Software and Mitigate Risk" # site tagline that appears below site title in masthead
name                     : "Carola Lilienthal and Henning Schwentner with ❤️ from WPS – Workplace Solutions"
description              : ""
url                      : "https://domain-driven-transformation.com/" 
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : "hschwentner/domain-driven-transformation.com" # GitHub username/repo-name
#logo                     : /assets/images/logo/square/dst_logo_transparent_no-text.png # path of logo image to display in the masthead, e.g. "/assets/assets/images/88x88.png"
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
breadcrumbs              : false # true, false (default)
words_per_minute         : 200

include:
  - _pages

# # Collections
# collections:
#   articles:
#     output: true
#     permalink: /:collection/:path/


# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jemoji
  - jekyll-include-cache

footer:
  links:
    - label: "Improve this page"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/hschwentner/domain-driven-transformation.com"
    # - label: "Licensed CC-BY-4.0"
    #   icon: "fab fa-creative-commons"
    #   url: "http://creativecommons.org/licenses/by/4.0/"
    - label: "Imprint"
      icon: "fas fa-balance-scale"
      url: "https://www.wps.de/impressum/"
    - label: "Privacy"
      icon: "fas fa-user-shield"
      url: "https://www.wps.de/en/privacy-policy"
    - label: "Contact"
      icon: "fas fa-handshake"
      url: "/#the-authors"
      # Domain-Driven Refactorings

atom_feed:
  hide: true

defaults:
  # _articles
  - scope:
      path: ""
      type: articles
    values:
      layout: single
      author_profile: true
      share: true
